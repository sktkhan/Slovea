name: Build DailyFix Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36.1 & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_DIR=$SDK_DIR"
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(id -un):$(id -gn)" "$SDK_DIR"
          fi
          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: >
          gradle :app:assembleDebug
          --no-daemon
          --no-configuration-cache
          --console=plain
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyFix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Run JVM Unit Tests
        run: >
          gradle :app:testDebugUnitTest
          --tests "com.example.CalculatorEnginesUnitTest"
          --tests "com.example.ExampleUnitTest"
          --no-daemon
          --no-configuration-cache
          --console=plain
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Check release signing secrets
        id: release_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK & AAB (Custom Secrets)
        if: steps.release_secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease :app:bundleRelease \
            --no-daemon \
            --no-configuration-cache \
            --console=plain \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Build Release APK (Auto-Signed for Direct Publishing)
        if: steps.release_secrets.outputs.ready != 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          PASS=$(openssl rand -hex 16)
          export STORE_PASSWORD="$PASS"
          export KEY_PASSWORD="$PASS"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DailyFix,O=DailyFix,C=US"
          gradle :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --console=plain \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyFix-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        if: steps.release_secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DailyFix-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
